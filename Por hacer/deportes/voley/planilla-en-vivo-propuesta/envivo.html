<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>En vivo — pantalla aprobada</title>
<style>
/* La pantalla del marcador en vivo que aprobó el dueño el 2026-09-16, viéndola
   en local. Copia fiel del prototipo `src/components/tournaments/en-vivo.tsx`,
   para verla sin levantar la app.

   ?hoja=1    abre la hoja de una vez
   ?rapido=1  rota los patrocinadores cada 3 segundos en vez de cada 2 minutos,
              para ver el ciclo */
:root{
  --fondo:#0B1120; --tarjeta:#111A2E; --hundido:#16203A; --linea:#26324B;
  --texto:#F4F6FA; --gris:#9AA4B8; --oro:#DFAE5C; --rojo:#EF4444;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--fondo);color:var(--texto);min-height:100vh;
  font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.pagina{max-width:1100px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:16px}

/* Lo de siempre de la página, resumido */
.torneo{border:1px solid var(--linea);border-radius:16px;background:var(--tarjeta);padding:16px}
.torneo h1{font-size:22px;line-height:1.25}
.torneo p{color:var(--gris);font-size:14px;margin-top:8px}
.resto{border:1px dashed var(--linea);border-radius:12px;padding:40px 16px;text-align:center;color:var(--gris);font-size:13px}

/* El aviso */
.aviso{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;
  border:1px solid rgba(239,68,68,.4);background:rgba(239,68,68,.10);border-radius:12px;
  padding:12px 16px;color:inherit;font:inherit;text-align:left;cursor:pointer}
.aviso .izq{display:flex;align-items:center;gap:12px}
.aviso b{display:block;color:var(--rojo);font-size:14px;letter-spacing:.04em}
.aviso span.sub{display:block;color:var(--gris);font-size:14px}
.aviso .ver{color:var(--oro);font-weight:600;font-size:14px;white-space:nowrap}
.pin{position:relative;width:10px;height:10px;flex:none}
.pin i{position:absolute;inset:0;border-radius:999px;background:var(--rojo)}
.pin i:first-child{animation:ping 1.2s cubic-bezier(0,0,.2,1) infinite;opacity:.6}
@keyframes ping{75%,100%{transform:scale(2.2);opacity:0}}

/* La hoja */
.velo{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none}
.hoja{position:fixed;left:0;right:0;bottom:0;max-height:90vh;display:none;flex-direction:column;
  background:var(--fondo);border-top:1px solid var(--linea);border-radius:18px 18px 0 0;
  max-width:512px;margin:0 auto}
.abierta .velo{display:block}.abierta .hoja{display:flex}
.cab{padding:16px;border-bottom:1px solid var(--linea);position:relative}
.cab h2{font-size:17px;display:flex;align-items:center;gap:8px}
.cab p{color:var(--gris);font-size:14px;margin-top:4px}
.cab .x{position:absolute;right:16px;top:16px;color:var(--gris);font-size:18px;cursor:pointer}
.spon{padding:12px 16px;border-bottom:1px solid var(--linea)}
.etq{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gris);margin-bottom:8px}
.logos{display:flex;gap:8px}
.logo{width:96px;height:56px;border-radius:8px;border:1px solid rgba(223,174,92,.3);background:var(--hundido);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;transition:opacity .3s}
.lista{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.p{border:1px solid rgba(239,68,68,.4);border-radius:12px;padding:12px;
  background:linear-gradient(180deg,rgba(239,68,68,.06),transparent);display:flex;flex-direction:column;gap:10px}
.p .arr{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--gris)}
.badge{display:flex;align-items:center;gap:6px;background:var(--rojo);color:#fff;border-radius:999px;
  padding:2px 8px;font-size:10px;font-weight:700;letter-spacing:.04em}
.badge i{width:6px;height:6px;border-radius:999px;background:#fff}
.eq{display:flex;align-items:center;gap:8px}
.esc{width:28px;height:28px;border-radius:6px;border:1px solid var(--linea);background:var(--hundido);flex:none}
.eq .n{flex:1;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eq .s{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.eq.pierde .n,.eq.pierde .s{color:var(--gris);font-weight:500}
.set{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--linea);
  background:rgba(255,255,255,.03);border-radius:8px;padding:8px 12px}
.set span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gris)}
.set b{font-size:18px;font-variant-numeric:tabular-nums}
.hace{font-size:11px;color:var(--gris)}
.pie{border-top:1px solid var(--linea);padding:12px}
.pie div{border:1px solid var(--linea);border-radius:8px;padding:10px;text-align:center;color:var(--oro);font-weight:600;font-size:14px}
</style>

<div class="pagina">
  <div class="torneo">
    <h1>TORNEO SANTO COFFEE MASCULINO SENIOR 🏐</h1>
    <p>8 equipos · En curso · Organizador: …</p>
  </div>

  <button class="aviso" onclick="abrir(true)">
    <span class="izq"><span class="pin"><i></i><i></i></span>
      <span><b>EN VIVO</b><span class="sub">3 partidos jugándose ahora</span></span></span>
    <span class="ver">Ver marcadores →</span>
  </button>

  <div class="resto">Patrocinadores, pestañas, tabla… (la página de siempre, sin cambios)</div>
</div>

<div class="velo" onclick="abrir(false)"></div>
<div class="hoja">
  <div class="cab">
    <h2><span class="pin"><i></i><i></i></span> En vivo</h2>
    <p>3 partidos jugándose ahora</p>
    <span class="x" onclick="abrir(false)">✕</span>
  </div>
  <div class="spon">
    <div class="etq">Patrocinadores <span id="ciclo"></span></div>
    <div class="logos" id="logos"></div>
  </div>
  <div class="lista" id="lista"></div>
  <div class="pie"><div>↻ Actualizar</div></div>
</div>

<script>
function abrir(si){document.body.classList.toggle("abierta",si)}

var partidos=[
  {hora:"2:00 p. m. · Cancha 2",a:"Máster Voley",b:"Viking Lórica",sa:1,sb:0,set:2,pa:14,pb:11,hace:"hace 20 segundos"},
  {hora:"2:00 p. m. · Cancha 1",a:"Veteranía",b:"Alianza",sa:0,sb:0,set:1,pa:8,pb:9,hace:"hace 45 segundos"},
  {hora:"3:30 p. m. · Cancha 3",a:"Corporioles",b:"Legales",sa:1,sb:1,set:3,pa:12,pb:12,hace:"hace 2 minutos"}
];
document.getElementById("lista").innerHTML=partidos.map(function(p){
  var pa=p.sa<p.sb?" pierde":"", pb=p.sb<p.sa?" pierde":"";
  return '<div class="p"><div class="arr"><span>'+p.hora+'</span><span class="badge"><i></i>EN VIVO</span></div>'+
    '<div class="eq'+pa+'"><span class="esc"></span><span class="n">'+p.a+'</span><span class="s">'+p.sa+'</span></div>'+
    '<div class="eq'+pb+'"><span class="esc"></span><span class="n">'+p.b+'</span><span class="s">'+p.sb+'</span></div>'+
    '<div class="set"><span>Set '+p.set+', jugándose</span><b>'+p.pa+' – '+p.pb+'</b></div>'+
    '<div class="hace">Actualizado '+p.hace+'</div></div>';
}).join("");

/* Rotación de patrocinadores (sección 6 del documento).
   Máximo 6 por torneo. Siempre se ven 3. De a 3 en orden y, cuando se acaban,
   se sigue desde el principio. Con 5: ABC → DEA → BCD → EAB → CDE → ABC. */
var patrocinadores=["A","B","C","D","E"];
var colores=["#DFAE5C","#60A5FA","#4ADE80","#F472B6","#A78BFA","#FB923C"];
var VISIBLES=3, CADA_MS=/rapido=1/.test(location.search)?3000:120000, grupo=0;
function grupoVisible(n){
  if(patrocinadores.length<=VISIBLES) return patrocinadores.map(function(_,i){return i});
  var out=[]; for(var k=0;k<VISIBLES;k++) out.push((n*VISIBLES+k)%patrocinadores.length); return out;
}
function pintar(){
  var idx=grupoVisible(grupo);
  document.getElementById("logos").innerHTML=idx.map(function(i){
    return '<div class="logo" style="color:'+colores[i]+'">'+patrocinadores[i]+'</div>';}).join("");
  document.getElementById("ciclo").textContent=patrocinadores.length>VISIBLES?"· rotan cada 2 min":"";
}
pintar();
if(patrocinadores.length>VISIBLES) setInterval(function(){grupo++;pintar()},CADA_MS);
if(/hoja=1/.test(location.search)) abrir(true);
</script>
</html>
